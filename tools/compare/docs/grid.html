<!DOCTYPE html><html><head><style>@page{size:A4;margin:15mm}body{margin:0;font-family:"PT Sans";font-size:10pt}
.g{display:grid;gap:6pt;margin-bottom:14pt}.g>div{background:#dbeafe;border:1px solid #2563eb;padding:4pt}
</style></head><body>
<div class="g" style="grid-template-columns:100pt 1fr 2fr">  <div>100pt</div><div>1fr</div><div>2fr</div><div style="grid-column:1/-1">full</div></div>
<div class="g" style="grid-template-columns:auto 1fr auto"><div>авто</div><div>1fr середина</div><div>длинный авто текст</div></div>
<div class="g" style="grid-template-areas:'h h h' 's m m' 'f f f';grid-template-columns:120pt 1fr 1fr">
 <div style="grid-area:h">header</div><div style="grid-area:s">sidebar<br>2<br>3<br>4</div><div style="grid-area:m">main</div><div style="grid-area:f">footer</div></div>
<div class="g" style="grid-template-columns:repeat(3,1fr)"><div style="grid-row:span 2">span2 row</div><div>b</div><div>c</div><div>d</div><div>e</div><div style="grid-column:2/4">f 2/4</div></div>
<div class="g" style="grid-template-columns:repeat(auto-fill,minmax(90pt,1fr))"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div></div>
<div class="g" style="grid-template-columns:1fr 1fr 1fr;justify-items:center;align-items:center;grid-auto-rows:40pt"><div>c</div><div>c<br>c</div><div style="justify-self:end">end</div></div>
<div class="g" style="grid-template-columns:repeat(4,1fr);grid-auto-flow:row dense"><div style="grid-column:span 3">3</div><div style="grid-column:span 2">2</div><div>1</div><div>1b</div></div>
<div class="g" style="grid-template-rows:20pt 20pt;grid-auto-flow:column;grid-template-columns:none"><div>a</div><div>b</div><div>c</div><div>d</div></div>
</body></html>
